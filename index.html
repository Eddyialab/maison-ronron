<div id="app">
  <header class="hud">
    <div class="pill" id="hud-kibble" title="Croquettes">
      <svg class="ico"><use href="#i-kibble"/></svg><span id="kibble-count">0</span>
    </div>
    <div class="pill" id="hud-tuna" title="Boîtes de thon">
      <svg class="ico"><use href="#i-tuna"/></svg><span id="tuna-count">0</span>
    </div>
    <div class="pill" id="hud-lives" title="Vies">
      <svg class="ico heart"><use href="#i-heart"/></svg><span id="lives-count">5</span><span class="timer" id="lives-timer"></span>
    </div>
    <span class="grow"></span>
    <button class="iconbtn" id="btn-settings" type="button" aria-label="Réglages"><svg class="ico"><use href="#i-gear"/></svg></button>
  </header>

  <main>
    <!-- Maison -->
    <section class="screen" id="screen-home">
      <div class="map" id="map">
        <div class="world" id="world">
          <img class="plan" src="assets/monde.webp" alt="Le domaine vu du dessus : le manoir, ses jardins et la maison du gardien" draggable="false">
          <canvas id="farlayers" hidden></canvas>
          <div id="chunks"></div>
          <svg id="world-svg" viewBox="0 4916 2730 1536" aria-hidden="true"><g id="objects"></g></svg>
          <div id="markers"></div>
        </div>
        <canvas id="snow" hidden aria-hidden="true"></canvas>
        <button class="advbtn" id="btn-advent" type="button" hidden aria-label="Calendrier de l'Avent"><svg class="ico"><use href="#i-gift"/></svg><span id="advent-sub">Avent</span></button>
        <button class="btn ghost small mapbtn" id="btn-styles" type="button" hidden>Changer un style</button>
        <p class="maphint" id="room-hint"></p>
      </div>
      <button class="iconbtn zenbtn" id="btn-zen" type="button" aria-pressed="false" aria-label="Masquer l'interface pour regarder les chats"><svg class="ico"><use href="#i-eye-off"/></svg></button>
    </section>

    <!-- Niveau -->
    <section class="screen" id="screen-level" hidden>
      <div class="levelbar">
        <button class="iconbtn" id="btn-quit" type="button" aria-label="Quitter le niveau"><svg class="ico"><use href="#i-cross"/></svg></button>
        <div class="leveltitle"><strong id="level-title">Niveau 1</strong><span id="level-size"></span></div>
        <div class="fishes" id="fishes" aria-label="Poissons restants"></div>
      </div>
      <div class="boardwrap"><div class="board" id="board"></div></div>
      <div class="modes">
        <button class="mode help" id="btn-rules" type="button">Règles</button>
        <span class="chrono" id="chrono" hidden aria-label="Temps">0:00</span>
      </div>
      <p class="hint" id="level-hint">Un tap : une croix. Deux taps rapides : un chat.</p>
    </section>

    <!-- Boutique -->
    <section class="screen" id="screen-shop" hidden>
      <h2 id="mycats-title">Mes chats</h2>
      <div class="tunawrap" id="shop-tuna"></div>
      <div class="mycats" id="shop-cats"></div>
      <h2>Adopter un chat</h2>
      <div class="cards" id="shop-breeds"></div>
    </section>

    <!-- Cartes à collectionner -->
    <section class="screen" id="screen-cards" hidden></section>
  </main>

  <nav class="tabs">
    <button class="tab" id="tab-home" type="button" aria-current="page"><svg class="ico"><use href="#i-home"/></svg>Maison</button>
    <button class="tab" id="tab-cards" type="button"><svg class="ico"><use href="#i-cards"/></svg>Cartes</button>
    <button class="play" id="tab-play" type="button"><span class="playlabel">Jouer</span><span class="playsub" id="play-sub">Niveau 1</span></button>
    <button class="tab" id="tab-shop" type="button"><svg class="ico"><use href="#i-paw"/></svg>Chats</button>
  </nav>

  <div class="backdrop" id="backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>

<script src="assets/tiles.js?v=c1c3023d85"></script>

</body>
</html>
